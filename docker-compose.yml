# =============================================================================
# CONSIDERAÇÃO TÉCNICA (doc §5): PostgreSQL + Temporal.io via Docker
# Performance: healthchecks evitam race conditions no boot da API.
# Segurança: credenciais via variáveis de ambiente; rede isolada.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-payment_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payment_secret_change_me}
      POSTGRES_DB: ${DB_DATABASE:-payment_db}
    ports:
      # Host 15432 evita conflito com Postgres local na 5432
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-payment_user} -d ${DB_DATABASE:-payment_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - payment-network

  # -------------------------------------------------------------------------
  # CONSIDERAÇÃO TÉCNICA (doc §4 — opcional Temporal.io):
  # Espinha dorsal para orquestrar pagamentos CREDIT_CARD de forma durável.
  # -------------------------------------------------------------------------
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: payment-temporal
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=${DB_USERNAME:-payment_user}
      - POSTGRES_PWD=${DB_PASSWORD:-payment_secret_change_me}
      - POSTGRES_SEEDS=postgres
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    networks:
      - payment-network

  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: payment-temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - payment-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME:-payment_user}:${DB_PASSWORD:-payment_secret_change_me}@postgres:5432/${DB_DATABASE:-payment_db}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - payment-network

  # -------------------------------------------------------------------------
  # Worker Temporal (doc §4): executa o workflow CREDIT_CARD e suas activities.
  # Necessário quando TEMPORAL_ENABLED=true; mesma imagem da API.
  # -------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payment-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      # API aplica as migrations no start
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USERNAME:-payment_user}:${DB_PASSWORD:-payment_secret_change_me}@postgres:5432/${DB_DATABASE:-payment_db}?schema=public
      TEMPORAL_ADDRESS: temporal:7233
    command: ["node", "dist/infrastructure/temporal/worker.js"]
    healthcheck:
      disable: true
    networks:
      - payment-network

volumes:
  postgres_data:

networks:
  payment-network:
    driver: bridge
